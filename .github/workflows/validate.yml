name: Validate plugin release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate release package
        run: python scripts/validate_release.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test generic installer dry-run
        run: >-
          python scripts/install_agent_skills.py
          --dry-run
          --target "${{ runner.temp }}/golang-development-skills"

      - name: Install pinned Agent Skills reference validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate every Agent Skill
        run: python scripts/validate_skills_ref.py
